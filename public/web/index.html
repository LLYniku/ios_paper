<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f2e8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="每日论文" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>每日论文 Web</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">PaperDaily Web</p>
          <h1 id="page-title">今日</h1>
        </div>
        <button id="refresh-button" class="icon-button" type="button" aria-label="刷新">↻</button>
      </header>

      <main>
        <section id="summary-card" class="summary-card"></section>

        <section class="search-panel">
          <input id="search-input" type="search" placeholder="搜索标题、作者、关键词" autocomplete="off" />
          <div id="filter-row" class="filter-row"></div>
        </section>

        <section id="status-line" class="status-line" hidden></section>
        <section id="content-list" class="content-list"></section>
      </main>

      <nav class="tabbar" aria-label="主导航">
        <button class="tab active" data-tab="today" type="button">
          <span>☀︎</span>
          <b>今日</b>
        </button>
        <button class="tab" data-tab="classic" type="button">
          <span>◆</span>
          <b>经典</b>
        </button>
        <button class="tab" data-tab="network" type="button">
          <span>◎</span>
          <b>网络</b>
        </button>
        <button class="tab" data-tab="favorites" type="button">
          <span>★</span>
          <b>收藏</b>
        </button>
        <button class="tab" data-tab="settings" type="button">
          <span>⚙</span>
          <b>设置</b>
        </button>
      </nav>
    </div>

    <dialog id="detail-dialog" class="detail-dialog">
      <article id="detail-content"></article>
      <form method="dialog">
        <button class="close-button" value="close">关闭</button>
      </form>
    </dialog>

    <script src="./app.js" defer></script>
  </body>
</html>
