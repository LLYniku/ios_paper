name: Generate Daily Network Feed

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  schedule:
    # 21:30 UTC = 05:30 Asia/Shanghai (next day)
    - cron: "30 21 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: paperdaily-network-pages
  cancel-in-progress: false

jobs:
  generate-network-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync

      - name: Generate network feed
        env:
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ vars.OPENAI_API_BASE }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          OPENAI_WIRE_API: ${{ vars.OPENAI_WIRE_API }}
          OPENAI_DISABLE_RESPONSE_STORAGE: ${{ vars.OPENAI_DISABLE_RESPONSE_STORAGE }}
          GITHUB_TOKEN: ${{ github.token }}
          CUSTOM_CONFIG: ${{ vars.CUSTOM_CONFIG }}
        run: |
          uv run python scripts/run_network_feed.py \
            --config "$CUSTOM_CONFIG" \
            --output-dir public/data/network \
            --bundle-output ios/PaperDaily/PaperDaily/Resources/sample_network.json \
            --cache-path public/data/cache/network_summaries.json \
            --timezone Asia/Shanghai \
            --language zh-Hans

      - name: Commit generated network feed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/network public/data/cache/network_summaries.json ios/PaperDaily/PaperDaily/Resources/sample_network.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: update network feed"
          git stash push --include-untracked --message workflow-autostash || true
          git fetch origin ${GITHUB_REF_NAME}
          git rebase origin/${GITHUB_REF_NAME}
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy-pages:
    needs: generate-network-feed
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
